name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Download Godot export templates
        env:
          GODOT_VERSION: 4.7.2
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          curl -L --fail --retry 3 \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" \
            -o /tmp/export_templates.tpz
          unzip -q /tmp/export_templates.tpz -d /tmp/godot_templates
          cp -R /tmp/godot_templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Install Godot Android build template
        run: godot --headless --path . --editor --install-android-build-template

      - name: Import project
        run: godot --headless --path . --editor --quit

      - name: Export debug APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug Android build/HarvestHollowNative-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: harvest-hollow-native-android
          path: build/HarvestHollowNative-debug.apk
          if-no-files-found: error
